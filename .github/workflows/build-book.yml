name: Build book
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Verify immutable manuscript
        run: python scripts/project_integrity.py verify .
      - name: Build EPUB and PDF
        run: python scripts/build_book.py --project-root . --output-dir "${{ runner.temp }}/roman-book"
      - name: Validate deliverables
        run: python scripts/validate_book.py --project-root . --output-dir "${{ runner.temp }}/roman-book"
      - name: Verify no source changes
        run: |
          python scripts/project_integrity.py verify .
          git diff --exit-code
      - name: Publish EPUB and PDF as release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ runner.temp }}/roman-book/roman.epub" "${{ runner.temp }}/roman-book/det-vi-inte-visste-${RELEASE_TAG}.epub"
          cp "${{ runner.temp }}/roman-book/roman.pdf" "${{ runner.temp }}/roman-book/det-vi-inte-visste-${RELEASE_TAG}.pdf"
          gh release upload "$RELEASE_TAG" \
            "${{ runner.temp }}/roman-book/det-vi-inte-visste-${RELEASE_TAG}.epub" \
            "${{ runner.temp }}/roman-book/det-vi-inte-visste-${RELEASE_TAG}.pdf" \
            --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: roman-epub-pdf
          path: ${{ runner.temp }}/roman-book/roman.*
          if-no-files-found: error
