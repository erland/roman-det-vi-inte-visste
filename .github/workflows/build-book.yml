name: Build book
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Verify immutable manuscript
        run: python scripts/project_integrity.py verify .
      - name: Build EPUB and PDF
        run: python scripts/build_book.py --project-root . --output-dir "${{ runner.temp }}/roman-book"
      - name: Validate deliverables
        run: python scripts/validate_book.py --project-root . --output-dir "${{ runner.temp }}/roman-book"
      - name: Verify no source changes
        run: |
          python scripts/project_integrity.py verify .
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: roman-epub-pdf
          path: ${{ runner.temp }}/roman-book/roman.*
          if-no-files-found: error
